name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Instalar dependencias del cliente
        working-directory: client
        run: npm ci

      - name: Compilar el frontend
        working-directory: client
        run: npm run build

      - name: Instalar dependencias del servidor
        working-directory: server
        run: npm ci

      - name: Verificar sintaxis del servidor
        working-directory: server
        run: |
          node --check index.js
          node --check ai.js
          node --check store.js

      - name: Ejecutar tests del servidor
        working-directory: server
        run: node --test
